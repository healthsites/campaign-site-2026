name: Refresh health facilities

# Every Monday: download health facilities from the healthsites.io API,
# check that the site still builds, and open a pull request with the new
# map files. Nothing goes live until the pull request is merged.
#
# One-time setup in the repository settings:
#   1. Secrets and variables → Actions → New repository secret
#      Name: HEALTHSITES_API_KEY   Value: your healthsites.io API key
#   2. Actions → General → Workflow permissions:
#      tick "Allow GitHub Actions to create and approve pull requests"
#
# Run it now: Actions → Refresh health facilities → Run workflow.

on:
  schedule:
    - cron: '41 3 * * 1'   # Mondays 03:41 UTC
  workflow_dispatch: {}

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: refresh-facilities
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Download facilities from the healthsites.io API
        env:
          HEALTHSITES_API_KEY: ${{ secrets.HEALTHSITES_API_KEY }}
        run: python3 scripts/healthsites_facilities.py refresh --report "$RUNNER_TEMP/facility-report.md"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run the tests
        run: python -m unittest discover -s tests

      - name: Build the site with the new files
        run: TM_OFFLINE=1 pelican content -s publishconf.py -o output
        env:
          PYTHONPATH: ${{ github.workspace }}

      - name: Open or update the pull request
        uses: peter-evans/create-pull-request@v7
        with:
          branch: data/weekly-facility-refresh
          delete-branch: true
          add-paths: theme/static/geojson/*_facilities.geojson
          commit-message: "Data: weekly health facility refresh"
          title: "Weekly health facility refresh"
          body-path: ${{ runner.temp }}/facility-report.md
